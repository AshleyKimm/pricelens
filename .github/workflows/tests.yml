name: tests

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read   # read-only: CI never needs to write to the repo

jobs:
  pytest:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip

      - name: Install Tesseract (local OCR used for redaction)
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends tesseract-ocr

      - name: Install Python dependencies
        run: python -m pip install -r requirements.txt

      # No API keys: the tests never call a model (fakes, saved replays and a fake clock are used instead).
      - name: Run tests
        run: python -m pytest -q
